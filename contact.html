<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Website</title>
    <link href="./css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <section id="contact">
        <div class="container">
            <div class="section-title">
                <h2>Contact Me</h2>
                <div class="line"></div>
                <p> Feel free to contact me </p>
            </div>
            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="contact-info">
                        <h3 class="mb-4"> Get In Touch </h3>
                        <div class="d-flex mb-4">
                            <div class="me-3"> <i class="bi bi-envelope contact-icon"></i> </div>
                            <div>
                                <h5>Email</h5>
                                <p class="mb-0"> your@email.com </p>
                            </div>
                        </div>
                        <div class="d-flex mb-4">
                            <div class="me-3"> <i class="bi bi-telephone contact-icon"></i> </div>
                            <div>
                                <h5>Phone</h5>
                                <p class="mb-0"> +855 12 345 678 </p>
                            </div>
                        </div>
                        <div class="d-flex">
                            <div class="me-3"> <i class="bi bi-geo-alt contact-icon"></i> </div>
                            <div>
                                <h5>Location</h5>
                                <p class="mb-0"> Phnom Penh, Cambodia </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="card custom-card">
                        <div class="card-body p-4">
                            <h3 class="mb-4"> Send Me a Message </h3>
                            <form>
                                <div class="row">
                                    <div class="col-md-6 mb-3"> <label for="name" class="form-label"> Your Name </label>
                                        <input type="text" class="form-control" id="name" placeholder="Enter your name"
                                            required>
                                    </div>
                                    <div class="col-md-6 mb-3"> <label for="email" class="form-label"> Email Address
                                        </label> <input type="email" class="form-control" id="email"
                                            placeholder="Enter your email" required> </div>
                                </div>
                                <div class="mb-3"> <label for="subject" class="form-label"> Subject </label> <input
                                        type="text" class="form-control" id="subject" placeholder="Enter subject">
                                </div>
                                <div class="mb-3"> <label for="message" class="form-label"> Message </label> <textarea
                                        class="form-control" id="message" rows="5" placeholder="Write your message..."
                                        required></textarea> </div> <button type="submit" class="btn btn-primary"> <i
                                        class="bi bi-send"></i> Send Message </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container text-center">
            <h4> Ang Thyda </h4>
            <p> Web Programming | Student First Year | Programmer </p>
            <div class="mb-3"> <a href="#" class="social-link"> <i class="bi bi-facebook"></i> </a> <a href="#"
                    class="social-link"> <i class="bi bi-instagram"></i> </a> <a href="#" class="social-link"> <i
                        class="bi bi-github"></i> </a> <a href="#" class="social-link"> <i class="bi bi-linkedin"></i>
                </a> </div>
            <p class="mb-0"> &copy; 2026 Ang Thyda. All Rights Reserved. </p>
        </div>
    </footer>
</body>

</html>
