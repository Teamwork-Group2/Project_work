<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Website</title>
    <link href="./css/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"

        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<section id="skills" class="bg-light">
    <div class="container">
        <div class="section-title">
            <h2>My Skills</h2>
            <div class="line"></div>
            <p> My technical skills </p>
        </div>
        <div class="row">
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="skill-box">
                    <div class="d-flex justify-content-between">
                        <h5> <i class="bi bi-filetype-html"></i> HTML5 & CSS3 </h5> <span class="badge bg-success">
                            90%
                        </span>
                    </div>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-success" role="progressbar" style="width: 90%"> 90% </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="skill-box">
                    <div class="d-flex justify-content-between">
                        <h5> <i class="bi bi-filetype-css"></i> SASS </h5> <span class="badge bg-warning"> 70%
                        </span>
                    </div>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-warning" role="progressbar" style="width: 70%"> 70% </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="skill-box">
                    <div class="d-flex justify-content-between">
                        <h5> <i class="bi bi-bootstrap"></i> Bootstrap5 </h5> <span class="badge bg-danger"> 40%
                        </span>
                    </div>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-danger" role="progressbar" style="width: 40%"> 40% </div>
                    </div>
                </div>
            </div>
</section>
